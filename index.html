<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Самурай Контент</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom scrollbar for a more thematic feel */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1f2937; /* gray-800 */
      }
      ::-webkit-scrollbar-thumb {
        background: #dc2626; /* red-600 */
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #b91c1c; /* red-700 */
      }

      @keyframes status-fade-in {
        from {
          opacity: 0.4;
          transform: translateY(2px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes row-status-flash {
        0% { background-color: transparent; }
        20% { background-color: rgba(220, 38, 38, 0.1); }
        100% { background-color: transparent; }
      }

      .animate-status-fade {
        animation: status-fade-in 0.4s ease-out forwards;
      }

      .animate-status-flash {
        animation: row-status-flash 0.8s ease-out forwards;
      }

      /* Smooth transition for badge colors */
      .status-badge-transition {
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
    </style>
